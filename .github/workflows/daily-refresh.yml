name: Daily BC Parks dashboard refresh

on:
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run refresh even outside the 6 AM Vancouver schedule guard
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [manual-refresh]

permissions:
  contents: write

concurrency:
  group: bc-parks-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh dashboard metadata
        env:
          FORCE_REFRESH: ${{ github.event_name != 'schedule' && 'true' || 'false' }}
        run: node scripts/refresh-github-data.mjs

      - name: Build
        run: pnpm build

      - name: Commit refresh result
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh BC Parks dashboard metadata"
          file_pattern: public/refresh-status.json
