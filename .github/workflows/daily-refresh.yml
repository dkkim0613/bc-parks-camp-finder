name: Daily BC Parks dashboard refresh

on:
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bc-parks-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh dashboard metadata
        run: node scripts/refresh-github-data.mjs

      - name: Build
        run: pnpm build

      - name: Commit refresh result
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh BC Parks dashboard metadata"
          file_pattern: public/refresh-status.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
