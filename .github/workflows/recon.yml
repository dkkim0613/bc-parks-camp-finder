name: BC Parks recon (temporary)

on:
  workflow_dispatch: {}

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bcparks.ca homepage
        run: |
          curl -sS -D - -o home.html "https://bcparks.ca/" | head -40
          echo "--- home.html size ---"
          wc -c home.html

      - name: Fetch camping.bcparks.ca homepage
        run: |
          curl -sS -D - -o camping.html "https://camping.bcparks.ca/" | head -40
          echo "--- camping.html size ---"
          wc -c camping.html
          echo "--- script/link tags ---"
          grep -oE '(src|href)="[^"]+"' camping.html | sort -u | head -80

      - name: Look for API hints in camping.bcparks.ca HTML
        run: |
          grep -oiE '[a-z0-9.-]*api[a-z0-9.-]*\.[a-z]{2,}' camping.html | sort -u || true
          grep -oiE 'https?://[a-z0-9.-]+' camping.html | sort -u || true

      - name: Try common Discover Camping / Aspira API roots
        run: |
          for url in \
            "https://camping.bcparks.ca/api/availability" \
            "https://camping.bcparks.ca/api/resource" \
            "https://camping.bcparks.ca/api/park" \
            "https://reservations.bcparks.ca/" \
            "https://bcparks.aspirafocus.com/" \
            "https://bcparks.aspirafocus.com/api/availability" \
            "https://camping.bcparks.ca/create-booking/results" \
            ; do
            echo "== $url =="
            curl -sS -o /dev/null -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$url" || true
          done

      - name: Upload raw HTML for inspection
        uses: actions/upload-artifact@v4
        with:
          name: recon-html
          path: |
            home.html
            camping.html
          retention-days: 3
